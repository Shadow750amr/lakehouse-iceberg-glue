services:
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
    environment:
      FLOCI_STORAGE_MODE: hybrid
    
  glue:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - floci
    volumes:
      - ./:/home/glue user/jupyter/workspace/lakehouse-iceberg-glue # copying all from the current workspace into container
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro #volume for time zones
    environment: 
      - TZ=America/Mexico_City #time zone identifier somehow glue was taking UTC deprecating credentials of aws
      - AWS_DEFAULT_REGION=us-east-1
    stdin_open: true  # cli capabilities
    tty: true # cli capabilities
    user: root
    env_file: .env 

