services:
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
    environment:
      FLOCI_STORAGE_MODE: hybrid
    
  glue:
    image: public.ecr.aws/glue/aws-glue-libs:5
    depends_on:
      - floci
    volumes:
      - ./:/home/glue_user/jupyter/workspace/lakehouse-iceberg-glue # copying all from the current workspace into container
    stdin_open: true  # cli capabilities
    tty: true # cli capabilities
