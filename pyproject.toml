[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lakehouse-iceberg-glue"
version = "0.1.0"
description = "Pipelines PySpark con Iceberg y Glue"
readme = "README.md"
requires-python = ">=3.12"
# Dejamos las dependencias de empaquetado totalmente vacías
dependencies = []

# Dependencias para desarrollo y ejecución local
[tool.uv]
dev-dependencies = [
    "pyspark==3.5.1",
    "boto3>=1.43.110",
    "botocore>=1.43.110",
    "numpy==2.5.3",
    "pandera>=0.33.1",
    "py4j==0.10.9.7",
    "pyarrow==25.0.1",
    "python-dateutil==2.9.0.post0",
    "pyyaml>=6.0.3",
    "six==1.17.0",
    "yml>=0.0.1",
]

# Especificamos la carpeta raíz que contiene el código fuente
[tool.hatch.build.targets.wheel]
packages = ["glue_package"]